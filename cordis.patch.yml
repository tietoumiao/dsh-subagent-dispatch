# dsh-subagent-dispatch bundle layer — applied when a profile lists this
# package in dsh.profile.bundles (dsh.bundle.patch declaration).
#
# One row mounts two Host tools and two subagent providers (see lib/index.js):
#   1. the `dispatch_subagent` Host tool — per-call preset / reasoning_effort /
#      model / provider / cwd / schema, backed by the local provider
#      `dispatch-local`;
#   2. the model-facing `workflow` capability — ONE name, one disclosure. It
#      is the stock tool name, taken over PER AGENT (同名接管 ⇒ a real
#      redirect): a definition from the same `buildWorkflowDefinition` factory
#      (same `executeWorkflow`, stock COPYRIGHT/description/parameters) is
#      registered in each agent's OWN scope, so own-over-inherited
#      (dsh-tools 'view()') makes a `workflow` call run this package, and the
#      usage-rule prompt section is registered in the same agent scope (same
#      name ⇒ shadows the preset's copy instead of duplicating it).
#      `run_workflow` is the compatibility ALIAS: by default it is NOT
#      registered anywhere (nothing to hide behind), so the model sees exactly
#      one workflow tool; `exposeRunWorkflow: true` publishes it again, and
#      `shadowStockWorkflow: false` disables the takeover (no takeover, no
#      guard, alias published). `takeoverToolName` (default `workflow`)
#      renames the takeover; execution-time `tools.guard` survives only as the
#      fallback for an agent whose own scope already holds somebody else's
#      same-name tool;
#   3. the external subagent provider `dispatch` — whole-run preset + effort
#      for workflow agent() / subagentProvider, resolved through
#      ctx.subagents.startActivation.
#
# No row-level `config` block on purpose. The plugin does NOT export a Config
# schema: `apply(ctx, config = {})` reads providerName / localProviderName /
# delegateProviderName / preset / reasoningEffort / routeProvider / model /
# shadowStockWorkflow / takeoverToolName / shadowedToolNames straight off the
# row's config object and falls back to built-in defaults, so a profile can
# override any of them later (omitting a field just keeps its default) without
# editing this file. Disclosure knobs: `exposeRunWorkflow` (default false) and
# `shadowStockWorkflow` (default true). Keep that contract when changing lib/index.js.
- insert:
    - id: dsh-subagent-dispatch
      name: 'dsh-subagent-dispatch'
